# Project: Stream-Chat
# Architecture orchestrated with Docker Compose.
# - RabbitMQ acts as Source of Truth (SoT) for real messages.
# - Kafka processes high-frequency events (typing) to deduce state.
# - Node services connect both brokers and expose APIs/WebSockets.
services:
  # AMQP messaging broker (chat Source of Truth)
  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "15673:15672"

  # Zookeeper required by Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    ports:
      - "2181:2181"

  # Kafka broker for typing events and audit
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"

  # HTTP API to publish real messages to RabbitMQ (topic)
  chat_api:
    build: ./services/chat_api
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - EXCHANGE_CHAT=chat_messages
      - ROUTING_PREFIX=chat
      - PORT=3001
    depends_on:
      - rabbitmq
    ports:
      - "3001:3001"

  # HTTP API to publish "typing" events to Kafka
  typing_api:
    build: ./services/typing_api
    environment:
      - KAFKA_BROKER=kafka:9092
      - TOPIC_TYPING=typing_events
      - PORT=3002
    depends_on:
      - kafka
    ports:
      - "3002:3002"

  # WebSocket backend that consumes messages (RabbitMQ) and sends them to the client
  chat_backend:
    build: ./services/chat_backend
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - EXCHANGE_CHAT=chat_messages
      - PORT=8081
    depends_on:
      - rabbitmq
    ports:
      - "8085:8081"

  # Stateful processor: consumes typing (Kafka) and publishes status (RabbitMQ)
  typing_processor:
    build: ./services/typing_processor
    environment:
      - KAFKA_BROKER=kafka:9092
      - TOPIC_TYPING=typing_events
      - RABBITMQ_URL=amqp://rabbitmq
      - EXCHANGE_STATUS=status_updates
    depends_on:
      - kafka
      - rabbitmq

  # WebSocket backend that broadcasts "typing" status from RabbitMQ
  status_backend:
    build: ./services/status_backend
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - EXCHANGE_STATUS=status_updates
      - PORT=8082
    depends_on:
      - rabbitmq
    ports:
      - "8086:8082"

  # Audit bridge: RabbitMQ (chat_messages) -> Kafka (message_audit_log)
  audit_bridge:
    build: ./services/audit_bridge
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - EXCHANGE_CHAT=chat_messages
      - KAFKA_BROKER=kafka:9092
      - TOPIC_AUDIT=message_audit_log
    depends_on:
      - rabbitmq
      - kafka

  # Analytics service that consumes the audit log in Kafka
  analytics_service:
    build: ./services/analytics_service
    environment:
      - KAFKA_BROKER=kafka:9092
      - TOPIC_AUDIT=message_audit_log
    depends_on:
      - kafka

  # Static server for the client (chat.html)
  client_web:
    image: nginx:alpine
    volumes:
      - ./client:/usr/share/nginx/html:ro
    ports:
      - "8088:80"
    depends_on:
      - chat_backend
      - status_backend

networks:
  default:
    driver: bridge
