<!doctype html>
<!--
  Cliente Web de Stream-Chat
  Se conecta a dos WebSockets:
    - Mensajes reales: ws://localhost:8085/?group=<Grupo>
    - Estado typing:  ws://localhost:8086/?group=<Grupo>
  También envía POST a:
    - http://localhost:3001/message
    - http://localhost:3002/typing
  Uso:
    - Abrir dos pestañas con ?user=<Nombre>&group=<Grupo>
    - Cuando uno escribe, el otro ve "<user> está escribiendo..."
    - Al enviar, ambos ven "<user>: <texto>"
-->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stream Chat</title>
  <style>
    /* Estilos básicos de la UI del chat */
    body { font-family: system-ui, sans-serif; margin: 20px; }
    #messages { border: 1px solid #ccc; padding: 10px; height: 200px; overflow: auto; }
    #status { color: #666; height: 24px; }
    label { display:block; margin-top:8px; }
    input, button { padding:6px; }
  </style>
</head>
<body>
  <h1>Stream Chat</h1>
  <label>Usuario</label>
  <input id="user" value="Ana" />
  <label>Grupo</label>
  <input id="group" value="GrupoA" />
  <label>Mensaje</label>
  <input id="text" />
  <button id="send">Enviar</button>
  <button id="simulate">Simular flujo</button>
  <div id="status"></div>
  <div id="messages"></div>
  <div id="timeline" style="border:1px solid #ccc; padding:10px; margin-top:10px; height:160px; overflow:auto"></div>
  <script>
    // Referencias a elementos del DOM
    const userEl = document.getElementById('user');
    const groupEl = document.getElementById('group');
    const textEl = document.getElementById('text');
    const sendBtn = document.getElementById('send');
    const messagesEl = document.getElementById('messages');
    const statusEl = document.getElementById('status');

    // Conectamos a ambos WebSockets (mensajes y estado) del grupo
    function connectWS() {
      const g = encodeURIComponent(groupEl.value);
      const wsMsg = new WebSocket(`ws://localhost:8085/?group=${g}`);
      const wsStatus = new WebSocket(`ws://localhost:8086/?group=${g}`);
      wsMsg.onmessage = ev => {
        const m = JSON.parse(ev.data);
        const div = document.createElement('div');
        div.textContent = `${m.user}: ${m.text}`;
        messagesEl.appendChild(div);
        if (m.user !== userEl.value) {
          log(`Recibido mensaje: ${m.user} -> "${m.text}"`);
        }
      };
      wsStatus.onmessage = ev => {
        const s = JSON.parse(ev.data);
        statusEl.textContent = s.status === 'TYPING' ? `${s.user} está escribiendo...` : '';
        if (s.user !== userEl.value) {
          log(`Estado recibido: ${s.user}=${s.status}`);
        }
      };
    }

    // Helper para POST JSON
    async function postJSON(url, body) {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return res.json();
    }

    // Enviar mensaje real (RabbitMQ)
    sendBtn.onclick = () => {
      postJSON('http://localhost:3001/message', { user: userEl.value, group: groupEl.value, text: textEl.value });
      textEl.value = '';
      log(`Enviado mensaje: ${userEl.value} -> "${groupEl.value}"`);
    };

    let typingTimer;
    // Emitir evento de typing (Kafka) al escribir en la caja de texto
    textEl.addEventListener('input', () => {
      postJSON('http://localhost:3002/typing', { user: userEl.value, group: groupEl.value });
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {}, 300);
      log(`Typing enviado: ${userEl.value} -> ${groupEl.value}`);
    });

    // Añade entrada al timeline inferior con marca de tiempo
    function log(msg) {
      const t = document.getElementById('timeline');
      const div = document.createElement('div');
      const now = new Date();
      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      const ss = String(now.getSeconds()).padStart(2,'0');
      div.textContent = `${hh}:${mm}:${ss} ${msg}`;
      t.appendChild(div);
      t.scrollTop = t.scrollHeight;
    }

    // Simulación del flujo: typing (t0, t+1s) y luego mensaje (t+4s)
    document.getElementById('simulate').onclick = () => {
      const user = userEl.value;
      const group = groupEl.value;
      log(`Inicio simulación: ${user}/${group}`);
      postJSON('http://localhost:3002/typing', { user, group });
      log(`Typing enviado (t0)`);
      setTimeout(() => {
        postJSON('http://localhost:3002/typing', { user, group });
        log(`Typing enviado (t+1s)`);
      }, 1000);
      setTimeout(() => {
        postJSON('http://localhost:3001/message', { user, group, text: 'Hola' });
        log(`Mensaje enviado: "Hola" (t+4s)`);
      }, 4000);
    };

    // Inicializa usuario/grupo desde querystring (?user=&group=)
    const params = new URLSearchParams(location.search);
    const qpUser = params.get('user');
    const qpGroup = params.get('group');
    if (qpUser) userEl.value = qpUser;
    if (qpGroup) groupEl.value = qpGroup;
    connectWS();
  </script>
</body>
</html>
